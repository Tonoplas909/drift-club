name: Publication GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Vérification des scores : redéploie l'Edge Function verifier-course juste après le site, pour que le jeu publié et
  # la fonction rejouent les courses avec la même simulation. Il faut le secret SUPABASE_ACCESS_TOKEN (voir supabase/README.md) ;
  # sans lui, l'étape est sautée avec un avertissement et la fonction se redéploie à la main.
  fonction:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - if: env.SUPABASE_ACCESS_TOKEN == ''
        run: 'echo "::warning::Secret SUPABASE_ACCESS_TOKEN absent, Edge Function verifier-course non redéployée (à faire à la main)."'
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: actions/checkout@v4
      # version fixée : « latest » demande la dernière version à l'API de GitHub, qui refuse parfois (limite de requêtes)
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy verifier-course --project-ref studzxweqmgpuhgsvxmi --no-verify-jwt --use-api
